name: Deploy to Minikube using GitHub Actions

on: [push]

jobs:
  job1:
    runs-on: ubuntu-latest
    name: Build Node.js Docker Image and deploy to Minikube

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start minikube
        uses: medyagh/setup-minikube@master
        with:
          driver: docker

      - name: Check cluster
        run: |
          kubectl get nodes
          kubectl get pods -A

      - name: Build image
        run: |
          docker build -t devopshint/node-app:latest .

      - name: Load image into Minikube
        run: |
          minikube image load devopshint/node-app:latest
          minikube image ls | grep devopshint/node-app

      - name: Deploy to Minikube
        run: |
          kubectl apply -f k8s-node-app.yaml

      - name: Debug deployment
        run: |
          echo "=== Deployments ==="
          kubectl get deployments

          echo "=== Pods ==="
          kubectl get pods -o wide

          echo "=== Services ==="
          kubectl get services

          echo "=== Pod details ==="
          kubectl describe pods -l app=nodejs-app

      - name: Wait for pod
        run: |
          kubectl wait --for=condition=Ready pod -l app=nodejs-app --timeout=120s

      - name: Test application
        run: |
          echo "=== Final pod status ==="
          kubectl get pods -o wide

          echo "=== Service ==="
          minikube service list

          echo "=== Service URL ==="
          minikube service nodejs-app --url
